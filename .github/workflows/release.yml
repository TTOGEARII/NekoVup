name: Release

# v1.0.1 처럼 v로 시작하는 태그를 푸시하면 설치 파일을 빌드해 GitHub Release로 배포한다.
# 배포된 릴리스는 앱이 시작할 때 자동으로 감지해 업데이트 버튼을 띄운다 (Velopack).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Install Velopack CLI
        # 프로젝트의 Velopack 패키지와 같은 버전으로 고정한다. 어긋나면 설치 파일이 멈춘다.
        run: dotnet tool install -g vpk --version 1.2.161

      # 함께 설치되는 도구(FFmpeg, Video2X) 압축 파일. 판이 바뀌지 않으면 다시 받지 않는다.
      - name: Cache bundled tool downloads
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: tools-${{ hashFiles('tools/fetch-tools.ps1') }}

      # 태그 이름·버전·토큰은 명령 줄에 바로 끼워 넣지 않고 환경 변수로 넘긴다 (태그 이름에 든 글자가 명령으로 읽히지 않게).
      - name: Download previous releases (for delta updates)
        shell: pwsh
        run: vpk download github --repoUrl https://github.com/TTOGEARII/NekoVup --token $env:GH_TOKEN
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and pack installer
        shell: pwsh
        run: ./tools/pack.ps1 -Version $env:VERSION
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload to GitHub Release
        shell: pwsh
        run: vpk upload github --repoUrl https://github.com/TTOGEARII/NekoVup --publish --releaseName "NekoVup v$env:VERSION" --tag $env:TAG --token $env:GH_TOKEN
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 명령줄 판(nekovup.exe)도 같은 릴리스에 붙인다. scripts 폴더(옛 비디오 업스케일 스크립트)가 실행 파일 옆에 있어야 한다.
      - name: Attach command-line build
        shell: pwsh
        run: |
          ./tools/publish-cli.ps1
          if (-not (Test-Path publish/cli/scripts/realbasicvsr.py)) { throw 'publish/cli/scripts/realbasicvsr.py가 없습니다' }
          Compress-Archive publish/cli/nekovup.exe, publish/cli/scripts nekovup-cli-win-x64.zip
          gh release upload $env:TAG nekovup-cli-win-x64.zip --clobber
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
